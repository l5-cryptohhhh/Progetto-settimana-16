spring.application.name=social-network-backend

# Segreti e valori locali: backend/env.properties (non versionato, vedi env.properties.example).
# Vengono cercati sia lanciando dalla cartella backend sia dalla root del repo.
spring.config.import=optional:file:./env.properties,optional:file:./backend/env.properties

# L'autenticazione e' solo JWT: niente utente in memoria con password generata da Spring Boot
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/social_network}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Upload multipart: 20MB per singolo file (documenti), fino a 10 foto da 10MB per richiesta
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=110MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=7d

# Storage locale dei file
app.storage.upload-dir=${UPLOAD_DIR:uploads}
app.storage.max-photo-size=10MB
app.storage.max-document-size=20MB

# OCR (Tesseract)
app.ocr.tessdata-path=${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
app.ocr.language=ita+eng

# Geocoding (Nominatim / OpenStreetMap)
app.geocoding.base-url=https://nominatim.openstreetmap.org
app.geocoding.user-agent=ProgettoSettimana16/1.0 (+https://github.com/l5-cryptohhhh/Progetto-settimana-16)

# CORS per il frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
